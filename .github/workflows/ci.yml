name: CI — OSINT Security Scanner

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: 🧪 Run tests with coverage
        run: |
          pytest tests/ -v --tb=short --cov=scanner --cov=report --cov-report=term-missing

      - name: ✅ Lint check
        run: |
          pip install flake8
          flake8 scanner/ report/ main.py --max-line-length=120 --ignore=E501,W503,E302,E226,E231,E221,E127,E126,E225,W291,W292,F401,F841,E305